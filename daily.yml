name: Update data EOD IDX

on:
  schedule:
    - cron: "35 10,13 * * 1-5"   # 17:35 & 20:35 WIB, Senin-Jumat
    - cron: "35 23 * * 1-5"      # 06:35 WIB pagi berikutnya (cadangan kalau Yahoo telat)
  workflow_dispatch:           # tombol "Run workflow" untuk jalan manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python fetch_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/eod.json shares.csv
          git diff --cached --quiet || git commit -m "Data EOD $(date -u +%F)"
          git push
